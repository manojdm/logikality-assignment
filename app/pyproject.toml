[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docproc"
version = "0.1.0"
description = "Logikality document ingest API and async worker"
requires-python = ">=3.12"
readme = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC"]
ignore = [
  "S101",  # asserts in tests
  "B008",  # FastAPI Depends/File defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S311"]
"src/docproc/worker.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["docproc"]
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning:botocore.*",
  "ignore::DeprecationWarning:anyio.*",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["docproc"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
