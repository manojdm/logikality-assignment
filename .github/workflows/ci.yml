name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt
      - name: Ruff
        run: |
          ruff check app
          ruff format --check app
      - name: Mypy
        working-directory: app
        run: |
          mypy --strict src
          mypy tests --disable-error-code=typeddict-item --disable-error-code=return-value --disable-error-code=arg-type --disable-error-code=unused-ignore
      - name: Pytest
        working-directory: app
        run: pytest tests --cov=docproc --cov-report=term-missing --cov-report=xml --cov-fail-under=90 --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            app/junit.xml
            app/coverage.xml

  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  build:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=pr,prefix=pr-
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          load: true
          push: false
          tags: docproc:scan
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8080:8080 docproc:scan
          n=0
          until curl -fsS http://127.0.0.1:8080/health; do
            n=$((n+1))
            if [ "$n" -gt 30 ]; then exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q docproc
          curl -fsS http://127.0.0.1:8080/health | grep -q ok
          docker rm -f smoke
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: docproc:scan
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        continue-on-error: false
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: push
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
